<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Avaliação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>
:root{
  --paper:#F3F4EF; --surface:#FFFFFF; --sunk:#F7F8F4; --ink:#1B2430; --muted:#5B6672; --line:#D6DAD2;
  --accent:#1F5F8B; --accent-ink:#FFFFFF; --ok:#2F7A4A; --bad:#A63A32; --warn-bg:#F6EDD6; --sel:#E3EEF6;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--paper:#12171C;--surface:#1A2129;--sunk:#151B21;--ink:#E6EAED;--muted:#9AA6B0;--line:#2D3742;
    --accent:#6FA8D6;--accent-ink:#0E1620;--ok:#6FBF8A;--bad:#E27A72;--warn-bg:#3A3120;--sel:#1E3346;color-scheme:dark}
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:20px}
body.travado .wrap,body.travado .bar{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.travado input,body.travado textarea{-webkit-user-select:text;user-select:text}
@media print{body{display:none!important}}
.aviso-bloq{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:8px 16px;border-radius:999px;font-weight:700;z-index:99;font-size:.9rem}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:24px 18px 120px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 6px}
h2{font-size:1.25rem;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:.88rem}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.92rem;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.center{text-align:center}
.big-ok{font-size:3rem;line-height:1;margin-bottom:8px}
.alert{background:var(--warn-bg);border-left:4px solid #B9782A;border-radius:6px;padding:10px 14px;margin:12px 0;font-size:.95rem}
code{font-family:var(--mono);font-size:.9em;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 4px}
pre.code{font-family:var(--mono);font-size:.88rem;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre;margin:10px 0}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.nav button{all:unset;cursor:pointer;min-width:36px;height:36px;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:700;font-size:.9rem;padding:0 8px}
.nav button.feita{background:var(--sel);border-color:var(--accent)}
.nav button[aria-current]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav button:focus-visible{outline:3px solid var(--accent)}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qnum{background:var(--accent);color:var(--accent-ink);border-radius:8px;min-width:34px;height:34px;display:grid;place-items:center;font-weight:700}
.topic{color:var(--muted);font-size:.9rem}
.stem{margin:0 0 6px;font-size:1.05rem;white-space:pre-line}
.fig{margin:6px 0 12px;text-align:center}.fig img{max-width:100%;height:auto;max-height:340px;border-radius:10px;background:#fff}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt.sel{background:var(--sel);border-color:var(--accent)}
.opt input{margin-top:5px}
.letter{font-weight:700;min-width:22px}
.vf{display:grid;gap:8px;margin-top:12px}
.vf-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.vf-row .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.vf-row .seg label{padding:6px 14px;cursor:pointer;font-weight:700}
.vf-row .seg input{position:absolute;opacity:0;pointer-events:none}
.vf-row .seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.vf-row .seg label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:-3px}
.stem.lacunas{line-height:2.5}
.lac{display:inline-block;width:9em;max-width:100%;line-height:1.4;vertical-align:baseline;border:0;border-bottom:2px solid var(--accent);background:var(--sel);padding:2px 6px;margin:0 2px;border-radius:4px 4px 0 0}
.lac:focus{outline:2px solid var(--accent)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.prog{flex:1;min-width:0}
.prog .txt{font-size:.85rem;color:var(--muted)}
.track{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:var(--accent);width:0}
.rev-list{list-style:none;padding:0;margin:0} .rev-list li{margin:6px 0}
.rev-list .vazia{color:var(--bad);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;font-size:.9rem;color:var(--muted)}
.relogio{font-weight:700;font-variant-numeric:tabular-nums;padding:2px 10px;border-radius:999px;background:var(--sel)}
.relogio.fim{background:var(--bad);color:#fff}
.top button{all:unset;cursor:pointer;color:var(--accent);font-weight:700}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);max-width:min(460px,92vw);padding:22px}
dialog::backdrop{background:rgba(10,15,20,.5)}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.preview{background:#7a4ea3;color:#fff;text-align:center;padding:8px;font-weight:700;font-size:.9rem}
</style>
</head>
<body>
<div class="preview" id="preview" hidden>Pré-visualização do professor: tudo funciona como para o aluno (inclusive o anticola), mas o envio está desativado.</div>
<main class="wrap" id="app" aria-live="polite">
  <div class="card center"><p class="muted">Carregando…</p></div>
</main>
<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="prog"><div class="txt" id="progTxt"></div><div class="track"><div class="fill" id="progFill"></div></div></div>
    <button class="btn" id="bAnt">Anterior</button>
    <button class="btn primary" id="bProx">Próxima</button>
  </div>
</div>
<dialog id="dlg"><h2 id="dlgT"></h2><div id="dlgB"></div><div class="acts" id="dlgA"></div></dialog>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LETRAS="ABCDEFGH";
const params=new URLSearchParams(location.search);
const PROVA_ID=(params.get("p")||"").replace(/[^A-Za-z0-9]/g,"");
let auth,db,USER=null,PROVA=null,ST=null,TELA=0,ORDEM=null,QORD=null,PREVIEW=false,LOGIN_MSG="";

function svgNorm(svg){let s=String(svg||"").trim();const head=(s.match(/^<svg[^>]*>/i)||[""])[0];let h=head;
  if(!/xmlns=/.test(h))h=h.replace(/^<svg/i,'<svg xmlns="http://www.w3.org/2000/svg"');
  const vb=head.match(/viewBox="\s*[\d.-]+[\s,]+[\d.-]+[\s,]+([\d.]+)[\s,]+([\d.]+)\s*"/i);
  if(vb&&!/\swidth=/.test(head))h=h.replace(/^<svg/i,`<svg width="${vb[1]}" height="${vb[2]}"`);
  return head?h+s.slice(head.length):s}
function ehCelular(){
  const ua=navigator.userAgent||"";
  if(navigator.userAgentData&&navigator.userAgentData.mobile)return true;
  if(/Android|iPhone|iPod|Mobile|Mobi|Windows Phone|BlackBerry|Opera Mini/i.test(ua))return true;
  const menor=Math.min(screen.width,screen.height),toque=matchMedia("(pointer: coarse)").matches&&!matchMedia("(any-pointer: fine)").matches;
  return toque&&menor<600;
}
const tl=()=>String((PROVA&&PROVA.tipoAval)||"prova").toLowerCase(), tu=()=>{const t=tl();return t[0].toUpperCase()+t.slice(1)};
const svgSrc=svg=>"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgNorm(svg));
const altSvg=svg=>((svg.match(/aria-label="([^"]*)"/)||[])[1]||"Imagem da questão");
/* texto com `código` em linha, de forma segura */
function rico(el,txt){String(txt||"").split("`").forEach((p,i)=>{if(i%2){const c=document.createElement("code");c.textContent=p;el.appendChild(c)}else el.appendChild(document.createTextNode(p))})}
function tela(html){$("#app").innerHTML=html;$("#bar").hidden=true}
function dialogo(t,corpo,botoes){
  const d=$("#dlg");$("#dlgT").textContent=t;$("#dlgB").innerHTML=corpo;const a=$("#dlgA");a.innerHTML="";
  return new Promise(res=>{botoes.forEach(([txt,val,cls])=>{const b=document.createElement("button");b.className="btn "+(cls||"");b.textContent=txt;b.onclick=()=>{d.close();res(val)};a.appendChild(b)});d.showModal()});
}

/* ---------- embaralhamento determinístico por aluno ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function qordem(seed){const R=rng(seed^0x5bd1e995),a=[...PROVA.questoes.keys()];if(PROVA.embaralharQuestoes)for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ordem(seed){const R=rng(seed);return PROVA.questoes.map(q=>{const n=q.tipo==="mc"?q.alternativas.length:0;const a=[...Array(n).keys()];if(PROVA.embaralhar)for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a})}

/* ---------- rascunho local ---------- */
const chave=()=>`prova_${PROVA_ID}_${USER.uid}`;
function novoEstado(){return {seed:Math.floor(Math.random()*2147483647),inicio:Date.now(),saidas:0,log:[],reinicios:0,emAndamento:false,resp:PROVA.questoes.map(q=>q.tipo==="mc"?-1:q.tipo==="vf"?q.afirmacoes.map(()=>""):Array((q.enunciado.match(/\{\{#\}\}/g)||[]).length).fill(""))}}
function carregar(){try{const s=JSON.parse(localStorage.getItem(chave()));if(s&&Array.isArray(s.resp)&&s.resp.length===PROVA.questoes.length)return s}catch{}return novoEstado()}
function salvar(){try{localStorage.setItem(chave(),JSON.stringify({...ST,tela:TELA}))}catch{}}

/* ---------- modo anticola: tela cheia + vigilância de saídas ---------- */
let pausado=false,fsAtivo=false,ultimaViol=0,MSG_REINICIO=false;
const vigiaAtiva=()=>PROVA&&PROVA.vigiar&&ST&&ST.emAndamento&&!pausado;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
async function entrarTelaCheia(){
  const el=document.documentElement,req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!req){fsAtivo=false;return}
  try{await req.call(el,{navigationUI:"hide"});fsAtivo=true}catch{fsAtivo=false}
}
const fsSuportado=()=>{const el=document.documentElement;return !!((el.requestFullscreen||el.webkitRequestFullscreen)&&(document.fullscreenEnabled||document.webkitFullscreenEnabled))};
/* toda entrada nas questões passa por aqui: com anticola, só entra em tela cheia */
async function irPara(i){
  if(PROVA&&PROVA.vigiar&&i>0&&(!ST.emAndamento||(fsSuportado()&&!fsEl()))){
    await entrarTelaCheia();
    if(fsSuportado()&&!fsEl()){telaTelaCheia(i);return}
    if(!fsSuportado()&&!ST.semFsLog){ST.log=(ST.log||[]).concat({t:Date.now(),tipo:"aparelho sem suporte a tela cheia",info:true});ST.semFsLog=true}
    ST.emAndamento=true;pausado=false;ST.saidas=ST.saidas||0;salvar();
  }
  mostrar(i);
}
function telaTelaCheia(destino){
  tela(`<div class="card center"><div class="big-ok" aria-hidden="true">⛶</div>
    <h1>A ${tl()} precisa ser feita em tela cheia</h1>
    <p>O navegador não abriu a tela cheia. Clique no botão abaixo para tentar de novo.</p>
    <p><button class="btn primary" id="bFs">Entrar em tela cheia e continuar</button></p>
    <p class="small muted">Se continuar sem funcionar, pressione <b>F11</b> e clique no botão de novo, ou chame o professor.</p></div>`);
  $("#bFs").onclick=()=>irPara(destino);
}
function sairTelaCheia(){fsAtivo=false;const ex=document.exitFullscreen||document.webkitExitFullscreen;if(fsEl()&&ex)ex.call(document).catch?.(()=>{})}
function violacao(tipo){
  if(!vigiaAtiva())return;
  const agora=Date.now();if(agora-ultimaViol<2000)return;ultimaViol=agora;
  ST.log=(ST.log||[]).concat({t:agora,tipo}).slice(-60);ST.saidas=(ST.saidas||0)+1;pausado=true;
  if(ST.saidas>(PROVA.saidasPermitidas||0)){reiniciar();return}
  salvar();telaAviso();
}
function reiniciar(){
  const log=ST.log,rein=(ST.reinicios||0)+1;
  ST=novoEstado();ST.log=log;ST.reinicios=rein;ST.avisoReinicio=true;TELA=0;salvar();
  sairTelaCheia();pausado=false;pararRelogio();
  LOGIN_MSG=`Você saiu da tela durante a ${tl()}. Ela foi encerrada e suas respostas foram apagadas. Entre de novo para recomeçar do início.`;
  PROVA=null;ST=null;sair();
}
function telaAviso(){
  const resta=(PROVA.saidasPermitidas||0)-ST.saidas;
  sairTelaCheia();
  tela(`<div class="card center"><div class="big-ok" aria-hidden="true" style="color:var(--bad)">!</div>
    <h1>Você saiu da ${tl()}</h1>
    <p>Sair da tela cheia, trocar de aba ou abrir outra janela não é permitido.</p>
    <p class="alert"><b>${resta===0?"Este foi o último aviso.":`Restam ${resta} aviso(s).`}</b> Na próxima saída, a ${tl()} será encerrada, suas respostas serão apagadas e você terá que entrar de novo e recomeçar do zero.</p>
    <p><button class="btn primary" id="bVoltarProva">Voltar à ${tl()}</button></p></div>`);
  $("#bVoltarProva").onclick=()=>{pausado=false;irPara(TELA||1)};
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)violacao("trocou de aba ou minimizou")});
setInterval(()=>{if(vigiaAtiva()&&TELA>0&&fsSuportado()&&!fsEl())violacao("estava fora da tela cheia")},2500);
/* bloqueios: botão direito, copiar, colar, selecionar, imprimir e atalhos de código */
let ultTent={};
function tentativa(desc){
  const el=document.querySelector(".aviso-bloq")||document.body.appendChild(Object.assign(document.createElement("div"),{className:"aviso-bloq"}));
  el.textContent="Esta ação está bloqueada durante a avaliação.";clearTimeout(el._t);el._t=setTimeout(()=>el.remove(),1800);
  if(!PROVA||!ST)return;const agora=Date.now();if(ultTent[desc]&&agora-ultTent[desc]<4000)return;ultTent[desc]=agora;
  ST.log=(ST.log||[]).concat({t:agora,tipo:"tentou "+desc,tentativa:true}).slice(-60);salvar();
}
const emCampo=e=>!!(e.target&&e.target.closest&&e.target.closest("input,textarea"));
document.addEventListener("contextmenu",e=>{if(!PROVA)return;e.preventDefault();tentativa("usar o botão direito")},true);
["copy","cut"].forEach(ev=>document.addEventListener(ev,e=>{if(!PROVA)return;e.preventDefault();tentativa("copiar texto")},true));
document.addEventListener("paste",e=>{if(!PROVA)return;e.preventDefault();tentativa("colar texto")},true);
document.addEventListener("dragstart",e=>{if(PROVA)e.preventDefault()},true);
document.addEventListener("selectstart",e=>{if(PROVA&&!emCampo(e))e.preventDefault()},true);
document.addEventListener("keydown",e=>{
  if(!PROVA)return;const k=(e.key||"").toLowerCase(),c=e.ctrlKey||e.metaKey;let o="";
  if(k==="f12"||(c&&e.shiftKey&&["i","j","c","k"].includes(k))||(c&&e.altKey&&["i","j","c"].includes(k)))o="abrir as ferramentas de código";
  else if(c&&k==="u")o="ver o código da página";
  else if(c&&(k==="s"||k==="p"))o=k==="s"?"salvar a página":"imprimir a página";
  else if(c&&(k==="c"||k==="x"))o="copiar texto";
  else if(c&&k==="a"&&!emCampo(e))o="selecionar tudo";
  if(o){e.preventDefault();e.stopPropagation();tentativa(o)}
},true);
document.addEventListener("keyup",e=>{if(PROVA&&e.key==="PrintScreen")tentativa("capturar a tela")},true);
window.addEventListener("blur",()=>setTimeout(()=>{if(!document.hasFocus())violacao("trocou de janela ou programa")},1200));
["fullscreenchange","webkitfullscreenchange"].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl()&&fsAtivo){fsAtivo=false;violacao("saiu da tela cheia")}}));
function respondida(i){const q=PROVA.questoes[i],r=ST.resp[i];if(q.tipo==="mc")return r>=0;if(q.tipo==="vf")return r.every(x=>x);return r.every(x=>String(x).trim())}

/* ---------- início ---------- */
async function iniciar(){
  if(!window.firebase||!window.FIREBASE_CONFIG){tela(`<div class="card"><h1>Não foi possível carregar</h1><p>Verifique a internet e recarregue a página.</p></div>`);return}
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
  await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});
  if(!PROVA_ID){tela(`<div class="card"><h1>Link incompleto</h1><p>Abra a prova pelo link enviado pelo professor.</p></div>`);return}
  auth.onAuthStateChanged(u=>{USER=u;u?abrir():telaLogin()});
}
function telaLogin(msg){msg=msg||LOGIN_MSG;LOGIN_MSG="";
  tela(`<div class="card center">
    <h1>Avaliação</h1>
    <p>Entre com a sua conta Google da escola para começar.</p>
    ${msg?`<div class="alert">${esc(msg)}</div>`:""}
    <p><button class="btn primary" id="bGoogle">Entrar com Google</button></p>
    <p class="small muted">Use o e-mail institucional cadastrado pelo professor.</p></div>`);
  $("#bGoogle").onclick=entrar;
}
async function entrar(){
  const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  try{await auth.signInWithPopup(p)}
  catch(e){
    if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){try{await auth.signInWithRedirect(p);return}catch{}}
    if(e.code==="auth/popup-closed-by-user"||e.code==="auth/cancelled-popup-request")return;
    telaLogin(e.code==="auth/network-request-failed"?"Sem conexão com a internet.":"Não foi possível entrar. Se aparecer “acesso bloqueado”, avise o professor.");
  }
}
async function sair(){try{await auth.signOut()}catch{}}

async function abrir(){
  tela(`<div class="card center"><p class="muted">Abrindo…</p></div>`);
  PREVIEW=(USER.email||"").toLowerCase()===String(PROFESSOR_EMAIL).toLowerCase();
  $("#preview").hidden=!PREVIEW;
  if(!PREVIEW){
    try{const r=await db.collection("recibos").doc(`${PROVA_ID}_${USER.uid}`).get();if(r.exists){try{const d=await db.collection("provas").doc(PROVA_ID).get();if(d.exists)PROVA=d.data()}catch{}enviada(r.data().enviadoEm);return}}catch{}
  }
  try{const d=await db.collection("provas").doc(PROVA_ID).get();if(!d.exists)throw{code:"not-found"};PROVA=d.data()}
  catch(e){
    tela(`<div class="card"><div class="top"><span>${esc(USER.email)}</span><button id="bSair">Trocar de conta</button></div>
      <h1>Indisponível no momento</h1>
      <p>${e.code==="not-found"?"Este link não existe. Confira com o professor.":"Esta avaliação não está aberta ou o seu e-mail não está na lista da turma."}</p>
      <p class="muted small">Se acha que é um engano, mostre esta tela ao professor.</p></div>`);
    $("#bSair").onclick=sair;return;
  }
  if(PROVA.bloquearCelular&&ehCelular()){
    tela(`<div class="card center"><div class="big-ok" aria-hidden="true">💻</div>
      <h1>Use um computador</h1>
      <p>Esta ${tl()} só pode ser feita em computador ou notebook. O acesso pelo celular está bloqueado pelo professor.</p>
      <p class="muted small">Se você está em um computador e vê esta mensagem, chame o professor.</p>
      <p><button class="btn" id="bSair">Sair da conta</button></p></div>`);
    $("#bSair").onclick=sair;return;
  }
  ST=carregar();ORDEM=ordem(ST.seed);QORD=qordem(ST.seed);TELA=typeof ST.tela==="number"?ST.tela:0;
  if(ST.avisoReinicio){MSG_REINICIO=true;ST.avisoReinicio=false;TELA=0;salvar()}
  iniciarRelogio();
  document.title=PROVA.titulo;document.body.classList.add("travado");
  if(PROVA.vigiar&&ST.emAndamento){violacao("fechou ou recarregou a página");return}
  mostrar(TELA);
}
function enviada(ts,auto){
  const quando=ts&&ts.toDate?ts.toDate().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"";
  tela(`<div class="card center">
    <div class="big-ok" aria-hidden="true">✓</div>
    <h1>${PROVA?tu():"Avaliação"} enviada, aguardando correção</h1>
    ${auto?`<p class="alert">O tempo terminou e suas respostas foram enviadas automaticamente.</p>`:""}${quando?`<p class="muted">Enviada em ${esc(quando)}.</p>`:""}
    <p>Você já pode fechar esta página.</p>
    <p><button class="btn" id="bSair">Sair da conta</button></p></div>`);
  $("#bSair").onclick=sair;
}

/* ---------- telas da prova ---------- */
const N=()=>PROVA.questoes.length, ULT=()=>N()+1;
function cabecalho(){
  return `<div class="top"><span>${esc(USER.displayName||USER.email)}</span><button id="bSair">Sair</button></div>
  <h1>${esc(PROVA.titulo)}</h1>
  <div class="meta">${PROVA.fechaEm?'<span class="relogio" id="relogio" role="timer" aria-live="off"></span>':""}<span>${esc(PROVA.escolaNome||"")}</span><span>${esc(PROVA.turmaNome||"")}</span><span>${esc(PROVA.disciplinaNome||"")}</span>${PROVA.valor?`<span>Valor: ${esc(PROVA.valor)} pontos</span>`:""}</div>
  <nav class="nav" id="nav" aria-label="Ir para a questão"></nav>`;
}
function mostrar(i){
  TELA=Math.max(0,Math.min(ULT(),i));salvar();
  let corpo="";
  if(TELA===0){
    corpo=`<section class="card"><h2>Antes de começar</h2>
      ${PROVA.instrucoes?`<p style="white-space:pre-line">${esc(PROVA.instrucoes)}</p>`:""}
      <p>São ${N()} questões. Suas respostas ficam salvas neste navegador enquanto você responde.</p>
      <p><b>Você só pode enviar uma vez.</b> Depois do envio, não é possível alterar as respostas.</p>
      ${PROVA.vigiar?`<div class="alert"><b>${tu()} em tela cheia.</b> Ao clicar em Começar, a ${tl()} ocupa a tela toda. Sair da tela cheia, trocar de aba, abrir outra janela ou fechar a página ${PROVA.saidasPermitidas?`gera um aviso. Depois de ${PROVA.saidasPermitidas} aviso(s), a ${tl()} é encerrada, suas respostas são apagadas e você volta para a tela de login para recomeçar do zero.`:`<b>encerra a ${tl()}</b>: suas respostas são apagadas e você volta para a tela de login para recomeçar do zero.`}</div>`:""}</section>`;
    if(MSG_REINICIO){corpo=`<div class="alert" style="border-color:var(--bad)"><b>A ${tl()} foi reiniciada</b> porque você saiu da tela. Suas respostas anteriores foram apagadas.</div>`+corpo;MSG_REINICIO=false}
  }else if(TELA===ULT()){
    const faltam=PROVA.questoes.map((_,k)=>k).filter(k=>!respondida(k));
    corpo=`<section class="card"><h2>Revisão</h2>
      <p>${faltam.length?`Faltam <b>${faltam.length}</b> questão(ões) sem resposta completa.`:"Todas as questões estão respondidas."}</p>
      <ol class="rev-list">${PROVA.questoes.map((q,k)=>`<li><button class="btn" style="padding:2px 10px" data-ir="${k+1}">Questão ${k+1}</button> ${respondida(QORD[k])?"respondida":'<span class="vazia">incompleta</span>'}</li>`).join("")}</ol>
      <div class="acts" style="justify-content:flex-start"><button class="btn primary" id="bEnviar" ${PREVIEW?"disabled":""}>Enviar ${tl()}</button>${PREVIEW?'<button class="btn" id="bFimTeste">Encerrar teste</button>':""}</div></section>`;
  }else corpo=`<section class="card" id="qcard"></section>`;
  tela(cabecalho()+corpo);
  $("#bSair").onclick=async()=>{const r=await dialogo("Sair?",`<p>Suas respostas continuam salvas neste navegador, mas a ${tl()} <b>não foi enviada</b>.</p>`,[[`Continuar a ${tl()}`,0],["Sair",1,"primary"]]);if(r)sair()};
  if(TELA>0&&TELA<ULT())questao(QORD[TELA-1],TELA);
  document.querySelectorAll("[data-ir]").forEach(b=>b.onclick=()=>irPara(+b.dataset.ir));
  $("#bEnviar")?.addEventListener("click",()=>enviar(false));
  $("#bFimTeste")?.addEventListener("click",()=>{pausado=true;ST.emAndamento=false;localStorage.removeItem(chave());sairTelaCheia();tela(`<div class="card center"><h1>Teste encerrado</h1><p>Nada foi enviado. As respostas do teste foram apagadas deste navegador.</p><p><button class="btn" onclick="location.reload()">Testar de novo</button></p></div>`)});
  montarNav();barra();window.scrollTo({top:0});
}
function questao(qi,pos){
  const q=PROVA.questoes[qi],box=$("#qcard");
  const head=document.createElement("div");head.className="qhead";
  head.innerHTML=`<span class="qnum">${pos}</span><span class="topic"></span>`;head.querySelector(".topic").textContent=q.topico||"";
  box.appendChild(head);
  const stem=document.createElement("p");stem.className="stem";stem.id="st"+qi;box.appendChild(stem);
  if(q.tipo==="lacuna"){
    stem.classList.add("lacunas");
    const partes=q.enunciado.split("{{#}}");
    partes.forEach((p,k)=>{rico(stem,p);if(k<partes.length-1){const inp=document.createElement("input");inp.className="lac";inp.value=ST.resp[qi][k]||"";inp.setAttribute("aria-label",`Lacuna ${k+1}`);inp.autocomplete="off";inp.spellcheck=false;inp.oninput=()=>{ST.resp[qi][k]=inp.value;salvar();montarNav();barra()};stem.appendChild(inp)}});
  }else rico(stem,q.enunciado);
  if(q.codigo){const pre=document.createElement("pre");pre.className="code";pre.textContent=q.codigo;box.appendChild(pre)}
  if(q.imagem){const fig=document.createElement("div");fig.className="fig";const img=document.createElement("img");img.src=svgSrc(q.imagem);img.alt=altSvg(q.imagem);fig.appendChild(img);box.insertBefore(fig,stem)}
  if(q.tipo==="mc"){
    const opts=document.createElement("div");opts.className="opts";opts.setAttribute("role","radiogroup");opts.setAttribute("aria-labelledby","st"+qi);
    ORDEM[qi].forEach((orig,pos)=>{
      const lab=document.createElement("label");lab.className="opt";
      const inp=document.createElement("input");inp.type="radio";inp.name="q"+qi;
      if(ST.resp[qi]===orig){inp.checked=true;lab.classList.add("sel")}
      inp.onchange=()=>{ST.resp[qi]=orig;salvar();opts.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));lab.classList.add("sel");montarNav();barra()};
      const l=document.createElement("span");l.className="letter";l.textContent=LETRAS[pos]+")";
      const t=document.createElement("span");rico(t,q.alternativas[orig]);
      lab.append(inp,l,t);opts.appendChild(lab);
    });box.appendChild(opts);
  }
  if(q.tipo==="vf"){
    const vf=document.createElement("div");vf.className="vf";
    q.afirmacoes.forEach((af,k)=>{
      const row=document.createElement("div");row.className="vf-row";
      const t=document.createElement("span");rico(t,`${k+1}. ${af}`);
      const seg=document.createElement("span");seg.className="seg";seg.setAttribute("role","radiogroup");seg.setAttribute("aria-label",`Afirmação ${k+1}`);
      ["V","F"].forEach(v=>{const lab=document.createElement("label");const inp=document.createElement("input");inp.type="radio";inp.name=`q${qi}_${k}`;inp.value=v;inp.checked=ST.resp[qi][k]===v;inp.onchange=()=>{ST.resp[qi][k]=v;salvar();montarNav();barra()};lab.append(inp,document.createTextNode(v==="V"?"Verdadeiro":"Falso"));seg.appendChild(lab)});
      row.append(t,seg);vf.appendChild(row);
    });box.appendChild(vf);
  }
}
function montarNav(){
  const nav=$("#nav");if(!nav)return;nav.innerHTML="";
  const mk=(txt,i,feita,label)=>{const b=document.createElement("button");b.textContent=txt;if(feita)b.className="feita";if(TELA===i)b.setAttribute("aria-current","step");b.setAttribute("aria-label",label);b.onclick=()=>irPara(i);nav.appendChild(b)};
  mk("Início",0,false,"Início");
  PROVA.questoes.forEach((_,k)=>{const r=respondida(QORD[k]);mk(String(k+1),k+1,r,`Questão ${k+1}${r?", respondida":", sem resposta"}`)});
  mk("Revisão",ULT(),false,"Revisão e envio");
}
function barra(){
  $("#bar").hidden=false;const n=PROVA.questoes.filter((_,k)=>respondida(k)).length;
  $("#progTxt").textContent=`${n} de ${N()} respondidas`;$("#progFill").style.width=(n/N()*100)+"%";
  $("#bAnt").disabled=TELA===0;$("#bProx").hidden=TELA===ULT();
  $("#bProx").textContent=TELA===0?"Começar":TELA===N()?"Revisar":"Próxima";
}
$("#bAnt").onclick=()=>irPara(TELA-1);
$("#bProx").onclick=()=>irPara(TELA+1);

/* ---------- relógio: a prova fecha sozinha no horário definido pelo professor ---------- */
let ENVIANDO=false,relTimer=null,relSync=null;
const fimMs=()=>PROVA&&PROVA.fechaEm?(PROVA.fechaEm.toMillis?PROVA.fechaEm.toMillis():PROVA.fechaEm.seconds*1000):0;
function iniciarRelogio(){
  pararRelogio();if(!fimMs())return;
  relTimer=setInterval(tick,1000);tick();
  relSync=setInterval(async()=>{try{const d=await db.collection("provas").doc(PROVA_ID).get();if(d.exists){const n=d.data();PROVA.fechaEm=n.fechaEm||null;PROVA.status=n.status}}catch{}},60000);
}
function pararRelogio(){clearInterval(relTimer);clearInterval(relSync);relTimer=relSync=null}
function tick(){
  const fim=fimMs();if(!fim)return;
  const rest=Math.max(0,Math.floor((fim-Date.now())/1000)),el=$("#relogio");
  if(el){const m=Math.floor(rest/60),s=rest%60;el.textContent=`⏱ ${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;el.classList.toggle("fim",rest<=300);el.setAttribute("aria-label",`Tempo restante: ${m} minutos`)}
  if(rest<=5&&ST&&!PREVIEW&&!ENVIANDO&&document.querySelector(".nav")){pararRelogio();enviar(true)}
  if(rest<=0&&PREVIEW){pararRelogio()}
}

/* ---------- envio ---------- */
async function enviar(auto){
  if(PREVIEW||ENVIANDO)return;
  const faltam=PROVA.questoes.filter((_,k)=>!respondida(k)).length;
  const ok=auto?1:await dialogo(`Enviar a ${tl()}?`,`${faltam?`<p class="alert">Ainda há <b>${faltam}</b> questão(ões) incompleta(s).</p>`:""}<p>Depois de enviar, <b>não é possível alterar</b> as respostas.</p>`,[["Voltar",0],["Enviar agora",1,"primary"]]);
  if(!ok)return;
  ENVIANDO=true;const b=$("#bEnviar")||document.createElement("button");b.disabled=true;b.textContent="Enviando…";pausado=true;
  if(auto)tela(`<div class="card center"><h1>Tempo esgotado</h1><p>Enviando suas respostas automaticamente…</p></div>`);
  const id=`${PROVA_ID}_${USER.uid}`,ts=firebase.firestore.FieldValue.serverTimestamp();
  const resp=ST.resp.map(r=>Array.isArray(r)?r.map(x=>String(x).slice(0,200)):r);
  const batch=db.batch();
  batch.set(db.collection("respostas").doc(id),{provaId:PROVA_ID,turmaId:PROVA.turmaId,uid:USER.uid,email:(USER.email||"").toLowerCase(),nome:USER.displayName||"",seed:ST.seed,respostas:JSON.stringify(resp),ocorrencias:JSON.stringify({log:(ST.log||[]).slice(-60),reinicios:ST.reinicios||0}),inicioEm:ST.inicio,enviadoEm:ts});
  batch.set(db.collection("recibos").doc(id),{uid:USER.uid,provaId:PROVA_ID,enviadoEm:ts});
  try{await batch.commit();ST.emAndamento=false;localStorage.removeItem(chave());sairTelaCheia();pararRelogio();enviada(firebase.firestore.Timestamp.now(),auto)}
  catch(e){
    ENVIANDO=false;b.disabled=false;b.textContent=`Enviar ${tl()}`;pausado=false;if(auto){sairTelaCheia();mostrar(ULT())}
    const msg=e.code==="permission-denied"?"O envio foi recusado. Ela pode ter sido encerrada ou já foi enviada antes. Suas respostas continuam salvas neste navegador: mostre esta tela ao professor.":"Não consegui enviar. Verifique a internet e tente de novo. Suas respostas continuam salvas.";
    dialogo("Não foi enviado",`<p>${msg}</p>`,[["Entendi",0,"primary"]]);
  }
}
window.addEventListener("beforeunload",e=>{if(PROVA&&ST&&!PREVIEW&&!LOGIN_MSG&&document.querySelector(".nav")){e.preventDefault();e.returnValue=""}});
iniciar();
</script>
</body>
</html>
